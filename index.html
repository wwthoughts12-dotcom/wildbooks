<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wild Wild Thoughts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

:root{

--bg:#f4ede3;
--card:#fffdf8;
--gold:#c9a86a;
--gold-dark:#b3904e;
--text:#2d2926;
--muted:#7a746d;
--shadow:0 10px 30px rgba(0,0,0,.08);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Inter,sans-serif;
background:var(--bg);
color:var(--text);
padding-bottom:90px;

}

h1,h2,h3{

font-family:'Playfair Display',serif;

}

.container{

padding:18px;

}

.page{

display:none;

}

.page.active{

display:block;

}

.card{

background:var(--card);
border-radius:24px;
padding:22px;
margin-bottom:18px;
box-shadow:var(--shadow);

}

.hero{

padding:30px;

}

.hero h1{

font-size:42px;
margin-bottom:15px;

}

.hero p{

line-height:1.7;

}

.stats{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

}

.stat{

background:white;
border-radius:22px;
padding:25px;
text-align:center;
box-shadow:var(--shadow);

}

.stat-number{

font-size:42px;
font-weight:700;
color:var(--gold-dark);

}

.section-title{

font-size:28px;
margin-bottom:18px;

}

.book-grid{

display:grid;
grid-template-columns:
repeat(
auto-fill,
minmax(160px,1fr)
);

gap:16px;

}

.book-card{

background:white;
border-radius:20px;
overflow:hidden;
cursor:pointer;
box-shadow:var(--shadow);
transition:.2s;

}

.book-card:hover{

transform:translateY(-4px);

}

.book-cover{

width:100%;
height:250px;
object-fit:cover;
display:block;

}

.book-info{

padding:12px;

}

.book-title{

font-weight:600;
font-size:14px;
margin-bottom:6px;

}

.book-author{

font-size:12px;
color:var(--muted);

}

.search{

width:100%;
padding:14px;
border:none;
border-radius:16px;
margin-bottom:15px;
font-size:15px;

}

.filters{

display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;

}

.filter{

padding:10px 15px;
border:none;
border-radius:999px;
cursor:pointer;
background:white;

}

.filter.active{

background:var(--gold);
color:white;

}

.series-list{

display:grid;
gap:12px;

}

.series-item{

background:white;
padding:18px;
border-radius:18px;
display:flex;
justify-content:space-between;
box-shadow:var(--shadow);

}

.bottom-nav{

position:fixed;
left:0;
right:0;
bottom:0;
height:74px;

background:white;

display:flex;
justify-content:space-around;
align-items:center;

box-shadow:0 -5px 25px rgba(0,0,0,.08);

z-index:999;

}

.nav-btn{

border:none;
background:none;
cursor:pointer;

display:flex;
flex-direction:column;

gap:4px;

font-size:12px;
color:#666;

}

.nav-btn.active{

color:var(--gold-dark);

}

.modal{

position:fixed;
inset:0;

background:rgba(0,0,0,.75);

display:none;

justify-content:center;
align-items:center;

padding:20px;

z-index:9999;

}

.modal.show{

display:flex;

}

.modal-box{

background:white;
max-width:700px;
width:100%;

max-height:90vh;
overflow:auto;

border-radius:24px;
padding:25px;

}

.modal-cover{

width:100%;
max-height:500px;
object-fit:cover;
border-radius:20px;
margin-bottom:20px;

}

.btn{

display:inline-block;

padding:12px 18px;

background:var(--gold);
color:white;

text-decoration:none;
border:none;

border-radius:14px;

cursor:pointer;

margin-top:12px;

}

.favorite-btn{

margin-left:10px;

}

.art-image{

width:100%;
border-radius:18px;
margin-top:10px;
cursor:pointer;

}

.fullscreen{

position:fixed;
inset:0;
background:black;

display:none;

justify-content:center;
align-items:center;

z-index:99999;

}

.fullscreen img{

max-width:95%;
max-height:95%;

}

iframe{

border-radius:18px;

}

.loading{

text-align:center;
padding:20px;

}

</style>

</head>

<body>
    <div class="container">

<div id="about" class="page active">

<div class="card hero">

<h1>Wild Wild Thoughts</h1>

<p>
Добро пожаловать в библиотеку Wild Wild Thoughts.
Здесь собраны переводы современных любовных романов.
</p>

<br>

<h3>Строго 18+</h3>

</div>

<div class="stats">

<div class="stat">
<div class="stat-number" id="booksCount">0</div>
<div>Книг</div>
</div>

<div class="stat">
<div class="stat-number" id="seriesCount">0</div>
<div>Серий</div>
</div>

<div class="stat">
<div class="stat-number" id="playlistCount">0</div>
<div>Плейлистов</div>
</div>

<div class="stat">
<div class="stat-number" id="artCount">0</div>
<div>Артов</div>
</div>

</div>

</div>

<div id="home" class="page">

<div class="card">

<h2 class="section-title">
✨ Новинка
</h2>

<div id="newBook">

<div class="loading">
Загрузка...
</div>

</div>

</div>

<div class="card">

<h2 class="section-title">
📅 Скоро выйдет
</h2>

<div id="announcements">

<div class="loading">
Загрузка...
</div>

</div>

</div>

<div class="card">

<h2 class="section-title">
📖 В процессе перевода
</h2>

<div id="translationBooks"
class="book-grid">

</div>

</div>

<div class="card">

<h2 class="section-title">
📚 Серии
</h2>

<div
id="seriesContainer"
class="series-list">

</div>

</div>

</div>

<div id="catalog" class="page">

<div class="card">

<input
type="text"
id="searchInput"
class="search"
placeholder="Поиск книг...">

<div
id="seriesFilters"
class="filters">

</div>

<div
id="tropeFilters"
class="filters">

</div>

</div>

<div
id="catalogGrid"
class="book-grid">

</div>

</div>

<div id="playlists" class="page">

<div class="card">

<h2 class="section-title">
🎧 Плейлисты
</h2>

<div
id="playlistGrid"
class="book-grid">

</div>

</div>

</div>

<div id="arts" class="page">

<div class="card">

<h2 class="section-title">
🎨 Арты
</h2>

<div id="artsContainer">

</div>

</div>

</div>

</div>

<div class="bottom-nav">

<button
class="nav-btn active"
data-page="about">

📘
<span>О нас</span>

</button>

<button
class="nav-btn"
data-page="home">

🏠
<span>Главная</span>

</button>

<button
class="nav-btn"
data-page="catalog">

📚
<span>Каталог</span>

</button>

<button
class="nav-btn"
data-page="playlists">

🎧
<span>Плейлисты</span>

</button>

<button
class="nav-btn"
data-page="arts">

🖼️
<span>Арты</span>

</button>

</div>

<div
id="bookModal"
class="modal">

<div
class="modal-box"
id="bookContent">

</div>

</div>

<div
id="fullscreenViewer"
class="fullscreen">

<img
id="fullscreenImage"
src="">

</div>

<script>

const BOOKS_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vQI8CHOf1D1itshzP1MtTu4KDz803QihzIa6WXq-anfYkOA_k_OV27sRDET04qVr202wnqCB7X95ogO/pub?output=csv';

const ANNOUNCEMENTS_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vTlVHOEmWsc7BjxeB1w0dcqsTuPCstHe7lrA5fIPUNMFaoLmPSjqyzO3LPkoUpxQNY8ShrWCXBXyf_X/pub?output=csv';

const ARTS_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vSho-xQsv1AtpTa-k_wDgcO968CYzd546FRuxVXAsWHDt1Y8Ey6yYOL_kEJ5cKiNC7VcYeMtfSYboQE/pub?output=csv';

let books = [];
let announcements = [];
let arts = [];

let currentSeries = 'Все';
let currentTrope = 'Все';

const favorites =
JSON.parse(
localStorage.getItem(
'favorites'
) || '[]'
);
    function loadCSV(url){

return new Promise((resolve,reject)=>{

Papa.parse(url,{

download:true,
header:true,
skipEmptyLines:true,

complete:(result)=>{

resolve(result.data);

},

error:(error)=>{

reject(error);

}

});

});

}

async function loadData(){

try{

books =
await loadCSV(
BOOKS_URL
);

announcements =
await loadCSV(
ANNOUNCEMENTS_URL
);

arts =
await loadCSV(
ARTS_URL
);

updateStats();

renderHome();

renderCatalog();

renderPlaylists();

renderArts();

}catch(error){

console.error(error);

alert(
'Ошибка загрузки Google Sheets'
);

}

}

function updateStats(){

document.getElementById(
'booksCount'
).textContent =
books.length;

const series =
new Set();

books.forEach(book=>{

if(book.series){

series.add(
book.series
);

}

});

document.getElementById(
'seriesCount'
).textContent =
series.size;

document.getElementById(
'playlistCount'
).textContent =
books.filter(
b=>b.spotify_playlist
).length;

let totalArts = 0;

arts.forEach(item=>{

if(!item.arts) return;

totalArts +=
item.arts
.split('|')
.length;

});

document.getElementById(
'artCount'
).textContent =
totalArts;

}

function renderHome(){

renderNewBook();

renderAnnouncements();

renderTranslations();

renderSeries();

}

function renderNewBook(){

const container =
document.getElementById(
'newBook'
);

if(!books.length){

container.innerHTML =
'Нет данных';

return;

}

const newest =
books[0];

container.innerHTML =

createBookCard(
newest
);

}

function renderAnnouncements(){

const container =
document.getElementById(
'announcements'
);

container.innerHTML = '';

announcements.forEach(item=>{

container.innerHTML += `

<div class="card">

<img
src="${item.cover_url}"
class="book-cover">

<br>

<h3>${item.title}</h3>

<br>

<p>
${item.tropes || ''}
</p>

<br>

<strong>
${item.date_active || ''}
</strong>

</div>

`;

});

}

function renderTranslations(){

const container =
document.getElementById(
'translationBooks'
);

container.innerHTML = '';

announcements.forEach(item=>{

container.innerHTML += `

<div class="book-card">

<img
src="${item.cover_url}"
class="book-cover">

<div class="book-info">

<div class="book-title">

${item.title}

</div>

<div class="book-author">

${item.tropes || ''}

</div>

</div>

</div>

`;

});

}

function renderSeries(){

const container =
document.getElementById(
'seriesContainer'
);

const map = {};

books.forEach(book=>{

if(!map[book.series]){

map[book.series] = 0;

}

map[book.series]++;

});

container.innerHTML = '';

Object.keys(map)
.sort()
.forEach(series=>{

container.innerHTML += `

<div class="series-item">

<span>
${series}
</span>

<strong>
${map[series]}
</strong>

</div>

`;

});

}
    function createBookCard(book){

return `

<div
class="book-card"
onclick="openBook('${book.ID}')">

<img
src="${book.cover_url}"
class="book-cover"
onerror="this.src='https://placehold.co/400x600/F5EFE5/C9A86A?text=Book'">

<div class="book-info">

<div class="book-title">
${book.title}
</div>

<div class="book-author">
${book.author || ''}
</div>

</div>

</div>

`;

}

function renderCatalog(){

buildSeriesFilters();

buildTropeFilters();

drawCatalog();

}

function buildSeriesFilters(){

const container =
document.getElementById(
'seriesFilters'
);

const series = [
'Все',
...new Set(
books
.map(
b=>b.series
)
.filter(Boolean)
)
];

container.innerHTML='';

series.forEach(item=>{

container.innerHTML += `

<button
class="filter ${
item===currentSeries
? 'active'
: ''
}"
onclick="selectSeries('${item}')">

${item}

</button>

`;

});

}

function buildTropeFilters(){

const container =
document.getElementById(
'tropeFilters'
);

const tropes =
new Set();

books.forEach(book=>{

if(!book.trops) return;

book.trops
.split(',')
.forEach(t=>{

tropes.add(
t.trim()
);

});

});

container.innerHTML='';

['Все',...tropes]
.forEach(item=>{

container.innerHTML += `

<button
class="filter ${
item===currentTrope
? 'active'
: ''
}"
onclick="selectTrope('${item}')">

${item}

</button>

`;

});

}

function selectSeries(series){

currentSeries = series;

renderCatalog();

}

function selectTrope(trope){

currentTrope = trope;

renderCatalog();

}

function drawCatalog(){

const grid =
document.getElementById(
'catalogGrid'
);

const search =
document
.getElementById(
'searchInput'
)
.value
.toLowerCase();

let filtered =
[...books];

if(currentSeries !== 'Все'){

filtered =
filtered.filter(
b=>
b.series ===
currentSeries
);

}

if(currentTrope !== 'Все'){

filtered =
filtered.filter(
b=>
(b.trops || '')
.includes(
currentTrope
)
);

}

if(search){

filtered =
filtered.filter(book=>{

return (

(book.title || '')
.toLowerCase()
.includes(search)

||

(book.author || '')
.toLowerCase()
.includes(search)

||

(book.series || '')
.toLowerCase()
.includes(search)

);

});

}

grid.innerHTML='';

filtered.forEach(book=>{

grid.innerHTML +=
createBookCard(book);

});

}

document
.addEventListener(
'input',
e=>{

if(
e.target.id ===
'searchInput'
){

drawCatalog();

}

}
);

function openBook(id){

const book =
books.find(
b=>
String(b.ID) ===
String(id)
);

if(!book) return;

const isFavorite =
favorites.includes(
String(id)
);

let spotify = '';

if(book.spotify_playlist){

const embed =
book.spotify_playlist
.replace(
'open.spotify.com/',
'open.spotify.com/embed/'
);

spotify = `

<br>

<iframe
src="${embed}"
width="100%"
height="352"
allowfullscreen
loading="lazy">

</iframe>

`;

}

document
.getElementById(
'bookContent'
)
.innerHTML = `

<img
src="${book.cover_url}"
class="modal-cover">

<h2>
${book.title}
</h2>

<br>

<p>
<strong>Автор:</strong>
${book.author || '-'}
</p>

<br>

<p>
<strong>Серия:</strong>
${book.series || '-'}
</p>

<br>

<p>
<strong>Тропы:</strong>
${book.trops || '-'}
</p>

<br>

<p>
${book.description || ''}
</p>

${spotify}

<a
href="${book.file_url || '#'}"
target="_blank"
class="btn">

Скачать книгу

</a>

<button
class="btn favorite-btn"
onclick="
toggleFavorite(
'${book.ID}'
)
">

${
isFavorite
? '❤️ Удалить'
: '🤍 Избранное'
}

</button>

`;

document
.getElementById(
'bookModal'
)
.classList.add(
'show'
);

}

function toggleFavorite(id){

const index =
favorites.indexOf(
String(id)
);

if(index > -1){

favorites.splice(
index,
1
);

}else{

favorites.push(
String(id)
);

}

localStorage.setItem(
'favorites',
JSON.stringify(
favorites
)
);

openBook(id);

}

document
.getElementById(
'bookModal'
)
.addEventListener(
'click',
function(e){

if(
e.target.id ===
'bookModal'
){

this.classList.remove(
'show'
);

}

}
);

function renderPlaylists(){

const grid =
document.getElementById(
'playlistGrid'
);

grid.innerHTML='';

books
.filter(
b=>
b.spotify_playlist
)
.forEach(book=>{

grid.innerHTML += `

<div
class="book-card"
onclick="
window.open(
'${book.spotify_playlist}',
'_blank'
)
">

<img
src="${book.cover_url}"
class="book-cover">

<div class="book-info">

<div class="book-title">

${book.title}

</div>

</div>

</div>

`;

});

}

function renderArts(){

const container =
document.getElementById(
'artsContainer'
);

container.innerHTML='';

arts.forEach(item=>{

const images =
(item.arts || '')
.split('|')
.filter(Boolean);

let gallery='';

images.forEach(img=>{

gallery += `

<img
src="${img}"
class="art-image"
onclick="
openFullscreen(
'${img}'
)
">

`;

});

container.innerHTML += `

<div class="card">

<h3>
${item.title}
</h3>

${gallery}

</div>

`;

});

}

function openFullscreen(src){

document
.getElementById(
'fullscreenImage'
)
.src = src;

document
.getElementById(
'fullscreenViewer'
)
.style.display =
'flex';

}

document
.getElementById(
'fullscreenViewer'
)
.addEventListener(
'click',
function(){

this.style.display =
'none';

}
);

document
.querySelectorAll(
'.nav-btn'
)
.forEach(btn=>{

btn.addEventListener(
'click',
()=>{

document
.querySelectorAll(
'.page'
)
.forEach(page=>{

page.classList.remove(
'active'
);

});

document
.querySelectorAll(
'.nav-btn'
)
.forEach(nav=>{

nav.classList.remove(
'active'
);

});

document
.getElementById(
btn.dataset.page
)
.classList.add(
'active'
);

btn.classList.add(
'active'
);

});

});

if(window.Telegram){

Telegram.WebApp.ready();
Telegram.WebApp.expand();

}

loadData();

</script>

</body>
</html>
