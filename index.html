let books = [];

let announcements = [];
let arts = [];

  async function loadCSV(url, name){

    try{

        const response = await fetch(
            url + '&_=' + Date.now(),
            {
                cache:'no-store'
            }
        );

        if(!response.ok){

            throw new Error(
                name + ': HTTP ' +
                response.status
            );

        }

        const text =
            await response.text();

        if(!text.trim()){

            throw new Error(
                name + ': пустой ответ'
            );

        }

        const result =
            Papa.parse(
                text,
                {
                    header:true,
                    skipEmptyLines:true
                }
            );

        if(result.errors?.length){

            console.warn(
                name,
                result.errors
            );

        }

        return result.data || [];

    }catch(error){

        console.error(
            'Ошибка загрузки ' + name,
            error
        );

        return [];

    }

}


async function loadData(){

    try{

    loadCSV(BOOKS_URL,'КНИГИ'),
    loadCSV(NEW_BOOKS_URL,'НОВИНКА'),
    loadCSV(ANNOUNCEMENTS_URL,'В ПРОЦЕССЕ'),
    loadCSV(ARTS_URL,'АРТЫ'),
    loadCSV(SERIES_URL,'СЕРИИ')
]);


        books = results[0];
newBooks = results[1];
announcements = results[2];
arts = results[3];
seriesData = results[4];
console.log("SERIES DATA:", seriesData);


        console.log(

        console.log(

}

function renderSeries(){

function buildSeriesFilters(){

    const container =
        document.getElementById(
            'seriesFilters'

    const series = [
        'Все',
        ...new Set(
            books
                .map(b => b.series)
                .filter(Boolean)
        )
    ];

    container.innerHTML = '';

    series.forEach(item => {

        const button =
            document.createElement('button');

        button.className =
            'filter' +
            (item === currentSeries
                ? ' active'
                : '');

        button.textContent = item;

        button.addEventListener(
            'click',
            () => selectSeries(item)
        );

        container.appendChild(button);

    });

}

function selectSeries(series){

}

function drawCatalog(){

const grid =
document.getElementById(
'catalogGrid'
);

const search =
document
.getElementById(
'searchInput'
)
.value
.toLowerCase();

let filtered =
[...books];

if(currentSeries !== 'Все'){

    filtered =
    filtered.filter(
        b =>
        (b.series || '').trim() ===
        (currentSeries || '').trim()
    );

}

if(search){

filtered =
filtered.filter(book=>{

return (

(book.title || '')
.toLowerCase()
.includes(search)

||

(book.author || '')
.toLowerCase()
.includes(search)

||

(book.series || '')
.toLowerCase()
.includes(search)

);

});

}

grid.innerHTML='';

filtered.forEach(book=>{

grid.innerHTML +=
createBookCard(book);

});

}

document
.addEventListener(
'input',
e=>{

if(
e.target.id ===
'searchInput'
){

drawCatalog();

}

}
);

);

const index =
favorites.indexOf(
String(id)

favorites.splice(
index,
1
);

}else{

favorites.push(
String(id)
);

'favorites',
JSON.stringify(
favorites
)
);

'bookModal'

function renderPlaylists(){

    const grid =
        document.getElementById(
            'playlistGrid'

        return;
    }

    grid.innerHTML = '';

    const playlistBooks =
        books.filter(

                book.spotify_playlist.trim() !== ''

    if(!playlistBooks.length){

}
    function openPlaylist(id){

    const book =
        books.find(
            b =>
                String(b.ID) ===
                String(id)
        );

    if(!book || !book.spotify_playlist){
        return;
    }

    let spotifyUrl =
        book.spotify_playlist.trim();

    /*
       Если ссылка:
       https://open.spotify.com/playlist/XXXXX

       преобразуем в:
       https://open.spotify.com/embed/playlist/XXXXX
    */

    if(
        spotifyUrl.includes(
            'open.spotify.com/'
        )
    ){

        spotifyUrl =
            spotifyUrl.replace(
                'open.spotify.com/',
                'open.spotify.com/embed/'
            );

    }

    document.getElementById(
        'playlistContent'
    ).innerHTML = `

        <img
            src="${book.cover_url}"
            class="playlist-modal-cover"

            onerror="
                this.style.display='none'
            "
        >

        <h2 class="playlist-modal-title">
            ${book.title || ''}
        </h2>

        <div class="playlist-modal-author">
            ${book.author || ''}
        </div>

        <iframe
            class="spotify-player"
            src="${spotifyUrl}"
            allow="
                autoplay;
                clipboard-write;
                encrypted-media;
                fullscreen;
                picture-in-picture
            "
            loading="lazy"
        ></iframe>

        <button
            class="btn close-modal"
            onclick="closePlaylist()"
        >
            Закрыть
        </button>

    `;

    document
        .getElementById(
            'playlistModal'
        )
        .classList.add(
            'show'
        );

}
    
function closePlaylist(){

    document
        .getElementById(
            'playlistModal'

        .classList.remove(
            'show'

}
    document
    .getElementById(
        'playlistModal'

        'click',
        function(e){

            if(
                e.target.id ===
                'playlistModal'
            ){

                closePlaylist();

            }

        }
    );


function renderArts(){

    const container =
        document.getElementById(
            'artsContainer'
        );

    if(!container){
        return;
    }

    container.innerHTML = '';

    if(!arts.length){

        container.innerHTML = `
            <div class="card">

        return;
    }


    arts.forEach(item => {

        const images =
            (item.arts || '')
                .split('|')
                .map(url => url.trim())
                .filter(Boolean);


        if(!images.length){
            return;
        }


        let gallery = '';


        images.forEach((image, index) => {

            gallery += `

                <img
                    src="${image}"
                    alt="${
                        item.title ||
                        'Арт ' + (index + 1)
                    }"
                    loading="lazy"

                    onclick="
                        openFullscreen(
                            '${image.replace(
                                /'/g,
                                "\\'"
                            )}'
                        )
                    "

                    onerror="
                        console.error(
                            'Не удалось загрузить арт:',
                            '${image.replace(
                                /'/g,
                                "\\'"
                            )}'
                        );
                    "
                >

            `;

        });


        container.innerHTML += `

            <div class="arts-book">

                <h2 class="arts-title">
                    ${item.title || 'Без названия'}
                </h2>

                <div class="arts-gallery">

                    ${gallery}

        `;

    });

}

        catalog:1,
        playlists:2,
        arts:3
    };

    const buttons =
        document.querySelectorAll('.nav-btn');

    if(buttons[navMap[pageId]]){

        buttons[
            navMap[pageId]
        ].classList.add('active');

    }

}
